#端口
server:
  port: 8080

#数据库连接
spring:
  application:
    name: trial
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/trial?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    # 数据源其他配置
    initialSize: 5
    minIdle: 5
    maxActive: 20
    maxWait: 60000
    timeBetweenEvictionRunsMillis: 60000
    minEvictableIdleTimeMillis: 300000
    validationQuery: SELECT 1 FROM DUAL
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    poolPreparedStatements: true
  #redis
  redis:
    # Redis数据库索引（默认为0）
    database: 0
    # Redis服务器地址,端口
    host: xxx.xxx.xxx.xxx
    port: 6379
    # Redis服务器连接密码（默认为空）
    password:
    jedis:
      pool:
        # 连接池最大连接数（使用负值表示没有限制）
        max-active: 20
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait:
        # 连接池中的最大空闲连接
        max-idle: 10
        min-idle: 1
    # 连接超时时间（毫秒）
    timeout: 1000ms
  #kafka
  kafka:
      bootstrap-servers: xxx.xxx.xxx.xxx:9092
      # producer 生产者
      producer:
        # 重试次数
        retries: 0
        # 应答级别:多少个分区副本备份完成时向生产者发送ack确认(可选0、1、all/-1)
        # acks=0 ： 生产者在成功写入消息之前不会等待任何来自服务器的响应。
        # acks=1 ： 只要集群的首领节点收到消息，生产者就会收到一个来自服务器成功响应。
        # acks=all ：只有当所有参与复制的节点全部收到消息时，生产者才会收到一个来自服务器的成功响应。
        acks: -1
        batch-size: 16384 # 批量大小
        buffer-memory: 33554432 # 生产端缓冲区大小
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # consumer消费者
      consumer:
        # 默认的消费组ID
        group-id: test-consumer-group
        # 是否自动提交offset
        enable-auto-commit: false
        # 当kafka中没有初始offset或offset超出范围时将自动重置offset;
        # earliest:重置为分区中最小的offset;
        # latest:重置为分区中最新的offset(消费分区中新产生的数据);
        # none:只要有一个分区不存在已提交的offset,就抛出异常;
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
# cloud中的zk配置
  cloud:
    zookeeper:
      connect-string: xxx.xxx.xxx.xxx:2181
    consul:
      discovery:
        service-name: trial
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true
        ip-address: localhost
#      host: localhost
#      prot: 8500
    #如果你要使用springcloud-loadblance 那么这个配置ribbon.enabled = false要这样配置才可以
    #这里仍使用ribbon算法提供的比较多，功能较为全面
#    loadbalancer:
#      ribbon:
#        enabled: true

# fegin
feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 3000
        loggerLevel: full


# hystrix
hystrix:
  command:
    default:
      execution:
        timeout:
          enabled: true
        isolation:
          thread:
            timeoutInMilliseconds: 2000
#resilience4j
resilience4j:
  timelimiter:
    instances:
      delay:
        # 设置超时时间2s
        timeout-duration: 2s
  circuitbreaker:
    configs:
      default:
        #熔断器打开的失败阈值30%
        failureRateThreshold: 30
        # 默认滑动窗口大小，circuitbreaker使用基于计数和时间范围欢动窗口聚合统计失败率
        slidingWindowSize: 10
        # 计算比率的最小值，和滑动窗口大小去最小值，即当请求发生5次才会计算失败率
        minimumNumberOfCalls: 5
        # 滑动窗口类型，默认为基于计数的滑动窗口
        slidingWindowType: TIME_BASED
        # 半开状态允许的请求数
        permittedNumberOfCallsInHalfOpenState: 3
        # 是否自动从打开到半开
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # 熔断器从打开到半开需要的时间
        waitDurationInOpenState: 2s
        recordExceptions: java.lang.Exception
    instances:
      delay:
        baseConfig: default
# mybitis
mybatis:
  mapperLocations: classpath:mapper/*.xml
  #开启sql打印
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#log
logging:
  level:
    root: info
    #这里填写的是生效的包名而不是类比如我这里是要开启openfegin的clent类所在的
    #也就是@FeginClient存在的类的debug日志
    com.trial.fegin: debug
    # 默认日志文件名
#    file: log
    # 默认日志路径
#     path: ./log
#     logback.xml路径，默认为classpath:logback.xml
#     config: ./logback.xml
rocketmq:
  name-server: xxx.xxx.xxx.xxx:9876
  producer:
    group: orderly-test-group
    # 超时时长 默认值
    send-message-timeout: 3000
    # 失败重试 默认值
    retry-times-when-send-failed: 2
